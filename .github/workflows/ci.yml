name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: product_tracker_test
          POSTGRES_USER: product_tracker
          POSTGRES_PASSWORD: product_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U product_tracker -d product_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://product_tracker:product_tracker@localhost:5432/product_tracker_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:migrate:deploy
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm --filter api test:integration
      - run: pnpm build
